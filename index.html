<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BibiLeaf">
  <meta name="theme-color" content="#5a9a6f">
  <meta name="description" content="Suivi doux de vos plantes d'intérieur">

  <title>BibiLeaf V2.0.2</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Apple touch icon -->
  <link rel="apple-touch-icon" href="icons/icon-512.png">
  <link rel="icon" href="icons/icon-192.png" type="image/png">

  <!-- Font + Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <!-- XLSX library (CDN, mis en cache par SW) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

  <!-- Animation de démarrage HTML/SVG -->
  <div id="splash-screen" class="splash-screen" aria-label="Chargement de BibiLeaf">
    <div class="splash-card">
      <svg class="splash-svg" viewBox="0 0 220 220" role="img" aria-label="Un petit pot BibiLeaf arrosé fait pousser une plante">
        <circle class="splash-sun" cx="172" cy="42" r="15"></circle>
        <g class="splash-can">
          <path d="M138 82 h42 a10 10 0 0 1 10 10 v23 h-62 v-23 a10 10 0 0 1 10-10z" fill="#9fd5ea"></path>
          <path d="M179 88 q20 5 28 25" fill="none" stroke="#75b6cf" stroke-width="9" stroke-linecap="round"></path>
          <path d="M126 93 l-23 13" fill="none" stroke="#75b6cf" stroke-width="9" stroke-linecap="round"></path>
          <circle cx="153" cy="94" r="4" fill="#f9ffff"></circle>
        </g>
        <g class="splash-drops">
          <path class="drop drop-1" d="M99 116 q6 8 0 15 q-6-7 0-15z" fill="#6fbbe8"></path>
          <path class="drop drop-2" d="M113 121 q5 7 0 13 q-5-6 0-13z" fill="#6fbbe8"></path>
          <path class="drop drop-3" d="M87 121 q5 7 0 13 q-5-6 0-13z" fill="#6fbbe8"></path>
        </g>
        <g class="splash-plant">
          <path class="sprout-stem" d="M110 151 C110 137 110 122 110 105" fill="none" stroke="#4f9b62" stroke-width="6" stroke-linecap="round"></path>
          <path class="sprout-leaf sprout-leaf-left" d="M109 123 C88 107 71 113 65 132 C82 136 101 134 109 123z" fill="#72bd74"></path>
          <path class="sprout-leaf sprout-leaf-right" d="M112 119 C135 101 154 107 160 127 C141 133 121 132 112 119z" fill="#5aaf68"></path>
        </g>
        <g class="splash-pot">
          <ellipse cx="110" cy="153" rx="56" ry="13" fill="#6f4a31"></ellipse>
          <path d="M58 148 h104 l-12 51 a12 12 0 0 1-12 10 h-56 a12 12 0 0 1-12-10z" fill="#d88355"></path>
          <path d="M53 139 h114 a8 8 0 0 1 8 8 v5 a8 8 0 0 1-8 8 h-114 a8 8 0 0 1-8-8 v-5 a8 8 0 0 1 8-8z" fill="#e49a6b"></path>
          <path d="M91 181 q19 14 38 0" fill="none" stroke="#8b5e3c" stroke-width="5" stroke-linecap="round"></path>
          <circle cx="88" cy="171" r="4" fill="#8b5e3c"></circle>
          <circle cx="132" cy="171" r="4" fill="#8b5e3c"></circle>
        </g>
      </svg>
      <div class="splash-title">BibiLeaf</div>
      <div class="splash-subtitle">On réveille doucement tes plantes…</div>
    </div>
  </div>

  <!-- App principale -->
  <div id="app" style="display:none">

    <!-- Header -->
    <header class="app-header">
      <div class="app-logo">
        <img src="icons/icon-192.png" alt="BibiLeaf">
        <span class="app-logo-name">BibiLeaf</span>
      </div>
      <div class="header-modes">
        <button class="mode-pill mode-pill--winter mode-pill--inactive" id="mode-winter" title="Mode hiver">
          ❄️ Hiver
        </button>
        <button class="mode-pill mode-pill--vacation mode-pill--inactive" id="mode-vacation" title="Mode vacances">
          Vacances
        </button>
      </div>
    </header>

    <!-- Contenu principal -->
    <main class="main-content" id="main-content">
      <!-- Rendu dynamique par app.js -->
    </main>

    <!-- Bouton ajout flottant -->
    <button class="fab" id="fab-add" aria-label="Ajouter une plante">+</button>

    <!-- Navigation bas de page -->
    <nav class="bottom-nav">
      <button class="nav-btn nav-btn--active" data-screen="today">
        <span class="nav-icon" data-nav-icon="today"></span>
        <span>Aujourd’hui</span>
      </button>
      <button class="nav-btn" data-screen="home">
        <span class="nav-icon" data-nav-icon="plant"></span>
        <span>Plantes</span>
      </button>
      <button class="nav-btn" data-screen="calendar">
        <span class="nav-icon" data-nav-icon="calendar"></span>
        <span>Timeline</span>
      </button>
      <button class="nav-btn" data-screen="rooms">
        <span class="nav-icon" data-nav-icon="room"></span>
        <span>Pièces</span>
      </button>
      <button class="nav-btn" data-screen="settings">
        <span class="nav-icon" data-nav-icon="settings"></span>
        <span>Réglages</span>
      </button>
    </nav>

  </div>

  <!-- App module -->
  <script type="module" src="app.js"></script>
</body>
</html>
